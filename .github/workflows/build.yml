
name: Compilar M4N OS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld git curl xorriso

      - name: Compilar M4N OS
        run: make all TOOLCHAIN=llvm

      - name: Guardar sistema operativo
        uses: actions/upload-artifact@v4
        with:
          name: M4N-OS-ISO
          path: "*.iso"
          if-no-files-found: error
